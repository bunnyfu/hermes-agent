name: receipt-dispatch

# Receipt-lane shim (fork-only): the fork's CI workflow is disabled, and the
# lane's token cannot re-enable it (no workflow scope). A NEW workflow file is
# enabled by default, so this shim provides a dispatchable entry point that
# calls the real ci.yaml orchestrator via workflow_call. It rides the receipt
# PR's base commit, so it never appears in the reviewed payload diff.

on:
  workflow_dispatch:

jobs:
  call-ci:
    uses: ./.github/workflows/ci.yaml
